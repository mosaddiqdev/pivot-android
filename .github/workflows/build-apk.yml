name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" || true
          yes | sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PIVOT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pivot.jks"
            echo "PIVOT_KEYSTORE_PATH=$RUNNER_TEMP/pivot.jks" >> "$GITHUB_ENV"
            echo "Using release keystore"
          else
            echo "No keystore secret found, the APK will be signed with the debug key"
          fi

      - name: Build release APK
        env:
          PIVOT_KEYSTORE_PASSWORD: ${{ secrets.PIVOT_KEYSTORE_PASSWORD }}
          PIVOT_KEY_ALIAS: ${{ secrets.PIVOT_KEY_ALIAS }}
          PIVOT_KEY_PASSWORD: ${{ secrets.PIVOT_KEY_PASSWORD }}
          PIVOT_VERSION_CODE: ${{ github.run_number }}
          PIVOT_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Pivot-${GITHUB_RUN_NUMBER}.apk"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Pivot-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
